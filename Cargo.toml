[package]
name = "pdftools"
version = "1.0.0"
edition = "2021"
authors = ["kit"]
description = "Nativní nástroj v Rustu pro manipulaci s PDF (slučování, rozdělování, komprese)"

[dependencies]
slint = "1.18"
lopdf = { version = "0.46", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.15"
open = "5.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
slint-build = "1.18"
